<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Private Gallery</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- ==========================================
       LOGIN SCREEN
       ========================================== -->

  <section id="loginScreen" class="login-screen">

    <div class="login-card">

      <div class="lock-icon">
        🔐
      </div>

      <h1>Private Gallery</h1>

      <p class="login-subtitle">
        Enter your PIN to access your private gallery.
      </p>


     <input
  type="password"
  id="pinInput"
  class="pin-input"
  placeholder="Enter PIN"
  autocomplete="off"
  autocapitalize="none"
  spellcheck="false"
>


      <button
        id="pinButton"
        class="primary-button"
        type="button"
      >
        Unlock Gallery
      </button>


      <p id="loginMessage" class="message"></p>

    </div>

  </section>


  <!-- ==========================================
       GALLERY SCREEN
       ========================================== -->

  <section id="galleryScreen" class="gallery-screen">

    <!-- HEADER -->

    <header class="gallery-header">

      <div>

        <h1>My Private Gallery</h1>

        <p>
          Your photos and videos
        </p>

      </div>


      <button
        class="lock-button"
        type="button"
        onclick="lockGallery()"
      >
        🔒 Lock
      </button>

    </header>


    <!-- UPLOAD AREA -->

    <div class="upload-section">

      <label
        for="photoInput"
        class="upload-button"
      >
        📸 Add Photos & Videos
      </label>


      <input
        type="file"
        id="photoInput"
        accept=".jpg,.jpeg,.png,.webp,.heic,.heif,.mp4,.webm,.mov,video/*"
        multiple
        hidden
      >


      <p id="uploadMessage" class="upload-message"></p>

    </div>


    <!-- GALLERY -->

    <main>

      <div
        id="galleryGrid"
        class="gallery-grid"
      ></div>

    </main>

  </section>


  <!-- ==========================================
       FULLSCREEN VIEWER
       ========================================== -->

  <div
    id="viewer"
    class="viewer"
    style="display: none;"
  ></div>


  <!-- ==========================================
       JAVASCRIPT
       ========================================== -->

  <script src="script.js?v=6"></script>

</body>
</html>
