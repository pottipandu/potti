<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Private Gallery</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen" class="login-screen">

    <div class="login-card">

      <div class="lock-icon">🔐</div>

      <h1>Private Gallery</h1>

      <p class="login-subtitle">
        Enter your password to continue
      </p>

      <form id="loginForm">

        <input
          id="pinInput"
          type="password"
          placeholder="Enter password"
          autocomplete="off"
          maxlength="100"
          spellcheck="false"
        >

        <button
          type="submit"
          class="unlock-button"
        >
          Unlock Gallery
        </button>

      </form>

      <p id="message" class="message"></p>

    </div>

  </section>


  <!-- GALLERY -->
  <section id="galleryScreen" class="gallery-screen">

    <header class="gallery-header">

      <div>
        <p class="small-label">PRIVATE</p>

        <h1>My Gallery</h1>

        <p class="gallery-subtitle">
          Your private photo collection
        </p>
      </div>

      <div class="header-actions">

        <label class="add-button">
          + Add Photos

          <input
            id="photoInput"
            type="file"
            accept="image/*"
            multiple
            hidden
          >
        </label>

        <button
          id="lockButton"
          class="lock-button"
          type="button"
        >
          🔒 Lock
        </button>

      </div>

    </header>


    <!-- EMPTY STATE -->
    <div id="emptyState" class="empty-state">

      <div class="empty-icon">🖼️</div>

      <h2>Your gallery is empty</h2>

      <p>
        Add your first photos to your private gallery.
      </p>

      <label class="empty-add-button">
        + Add Photos

        <input
          id="emptyPhotoInput"
          type="file"
          accept="image/*"
          multiple
          hidden
        >
      </label>

    </div>


    <!-- PHOTOS -->
    <main
      id="galleryGrid"
      class="gallery-grid"
    ></main>

  </section>


  <!-- PHOTO VIEWER -->
  <div
    id="viewer"
    class="viewer"
  >

    <button
      id="viewerClose"
      class="viewer-close"
      type="button"
    >
      ×
    </button>

    <img
      id="viewerImage"
      src=""
      alt="Gallery photo"
    >

  </div>


  <!-- YOUR JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
