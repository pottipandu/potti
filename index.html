```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Private Gallery</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- =========================
       LOGIN SCREEN
  ========================== -->

  <section id="loginScreen" class="login-screen">

    <div class="login-card">

      <div class="lock-icon">
        🔐
      </div>

      <h1>Private Gallery</h1>

      <p class="login-subtitle">
        Enter your PIN to continue
      </p>

      <!--
        This accepts:
        Letters
        Numbers
        Symbols
      -->

      <input
        id="pinInput"
        type="password"
        placeholder="Enter PIN"
        autocomplete="off"
        maxlength="100"
        spellcheck="false"
      >

      <div id="pinDots" class="pin-dots"></div>

      <button
        id="unlockButton"
        class="unlock-button"
        onclick="unlockGallery()"
      >
        Unlock Gallery
      </button>

      <p id="message" class="message"></p>

    </div>

  </section>


  <!-- =========================
       GALLERY SCREEN
  ========================== -->

  <section id="galleryScreen" class="gallery-screen">

    <header class="gallery-header">

      <div>
        <p class="small-label">PRIVATE</p>
        <h1>My Gallery</h1>
        <p class="gallery-subtitle">
          Your private photo collection
        </p>
      </div>

      <div class="header-actions">

        <label class="add-button">
          + Add Photos

          <input
            id="photoInput"
            type="file"
            accept="image/*"
            multiple
            hidden
          >
        </label>

        <button
          class="lock-button"
          onclick="lockGallery()"
        >
          🔒 Lock
        </button>

      </div>

    </header>


    <!-- =========================
         EMPTY GALLERY
    ========================== -->

    <div id="emptyState" class="empty-state">

      <div class="empty-icon">
        🖼️
      </div>

      <h2>Your gallery is empty</h2>

      <p>
        Add your first photos to your private gallery.
      </p>

      <label class="empty-add-button">
        + Add Photos

        <input
          type="file"
          accept="image/*"
          multiple
          hidden
          onchange="handleEmptyUpload(event)"
        >
      </label>

    </div>


    <!-- =========================
         PHOTO GRID
    ========================== -->

    <main
      id="galleryGrid"
      class="gallery-grid"
    ></main>

  </section>


  <!-- =========================
       FULLSCREEN PHOTO VIEWER
  ========================== -->

  <div
    id="viewer"
    class="viewer"
  >

    <button
      class="viewer-close"
      onclick="closeViewer()"
    >
      ×
    </button>

    <img
      id="viewerImage"
      src=""
      alt="Gallery photo"
    >

  </div>


  <script src="script.js"></script>

</body>
</html>
```
