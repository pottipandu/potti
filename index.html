<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Private Gallery</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- ================= LOGIN PAGE ================= -->

  <section id="loginScreen" class="screen login-screen">

    <div class="login-card">

      <div class="lock-icon">🔐</div>

      <h1>Private Gallery</h1>

      <p class="subtitle">
        Enter your password to continue
      </p>

      <form
        id="loginForm"
        onsubmit="event.preventDefault(); unlockGallery();"
      >

        <input
          id="pinInput"
          type="password"
          placeholder="Enter PIN"
          autocomplete="off"
          maxlength="100"
          spellcheck="false"
        >

        <button
          id="unlockButton"
          type="submit"
          class="unlock-button"
        >
          Unlock Gallery
        </button>

      </form>

      <p id="loginMessage" class="message"></p>

    </div>

  </section>


  <!-- ================= GALLERY PAGE ================= -->

  <section id="galleryScreen" class="screen gallery-screen hidden">

    <header class="gallery-header">

      <div>
        <h1>My Private Gallery</h1>

        <p>
          Your photos are stored privately.
        </p>
      </div>

      <button
        class="lock-button"
        onclick="lockGallery()"
      >
        🔒 Lock
      </button>

    </header>


    <main class="gallery-container">

      <!-- Upload area -->

      <div class="upload-section">

        <label
          for="photoInput"
          class="upload-button"
        >
          ＋ Add Photos
        </label>

        <input
          id="photoInput"
          type="file"
          accept="image/*"
          multiple
          hidden
        >

        <p id="uploadMessage" class="message"></p>

      </div>


      <!-- Empty gallery -->

      <div
        id="emptyGallery"
        class="empty-gallery"
      >

        <div class="empty-icon">📷</div>

        <h2>Your gallery is empty</h2>

        <p>
          Add your first photo to get started.
        </p>

      </div>


      <!-- Photo grid -->

      <div
        id="photoGrid"
        class="photo-grid"
      ></div>

    </main>

  </section>


  <!-- ================= PHOTO VIEWER ================= -->

  <div
    id="viewer"
    class="viewer hidden"
    onclick="closeViewer()"
  >

    <button
      class="viewer-close"
      onclick="closeViewer()"
    >
      ×
    </button>

    <img
      id="viewerImage"
      src=""
      alt="Photo"
      onclick="event.stopPropagation()"
    >

  </div>


  <!-- IMPORTANT:
       Cache-busting version number -->
  <script src="script.js?v=5"></script>

</body>
</html>
